<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>楚门的世界 · AR Sketch Book</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,"Microsoft YaHei",sans-serif}
    #ui{position:fixed;z-index:20;left:0;right:0;top:0;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
    #start{pointer-events:auto;border:0;border-radius:999px;padding:13px 24px;font-size:16px;background:#fff;color:#111;box-shadow:0 5px 25px #0006;cursor:pointer}
    #status{color:#fff;text-align:center;font-size:14px;text-shadow:0 2px 8px #000;background:#0006;padding:7px 12px;border-radius:12px}
    #hint{position:fixed;z-index:20;left:16px;right:16px;bottom:24px;text-align:center;color:#fff;font-size:13px;text-shadow:0 2px 8px #000;pointer-events:none}
    #scanning{display:none}
    a-scene{position:fixed;inset:0}
  </style>
</head>
<body>
  <div id="ui">
    <button id="start">开始 AR</button>
    <div id="status">点击“开始 AR”，允许摄像头，然后对准你的 Sketch Book</div>
  </div>
  <div id="hint">请把整张绘本页面放入镜头，保持距离稳定</div>
  <div id="scanning"></div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: #scanning;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-assets>
      <video id="arVideo" src="./video/truman.mp4" preload="auto" loop playsinline webkit-playsinline muted></video>
      <audio id="arAudio" src="./music/truman.wav" preload="auto"></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- 视频原比例为 720×1280，因此这里用竖屏比例 0.5625 -->
      <a-video id="videoPlane" src="#arVideo" position="0 0 0.02" width="0.56" height="1" material="shader: flat; transparent: true; opacity: 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const target = document.querySelector('#target');
    const video = document.querySelector('#arVideo');
    const audio = document.querySelector('#arAudio');
    const plane = document.querySelector('#videoPlane');
    const startBtn = document.querySelector('#start');
    const status = document.querySelector('#status');

    let started = false;

    startBtn.addEventListener('click', async () => {
      if (started) return;
      started = true;
      startBtn.style.display = 'none';
      status.textContent = '正在启动 AR，请允许摄像头权限…';
      try {
        await scene.systems['mindar-image-system'].start();
        status.textContent = 'AR 已启动：请扫描你的 Sketch Book';
      } catch (err) {
        console.error(err);
        status.textContent = '无法启动摄像头，请检查浏览器权限并使用 HTTPS 网页';
        startBtn.style.display = 'block';
        started = false;
      }
    });

    target.addEventListener('targetFound', async () => {
      status.textContent = '识别成功！正在播放《楚门的世界》AR…';
      plane.setAttribute('material', 'opacity', '1');
      try { await video.play(); } catch(e) { console.warn('video play:', e); }
      try { await audio.play(); } catch(e) { console.warn('audio play:', e); }
    });

    target.addEventListener('targetLost', () => {
      status.textContent = '请重新对准 Sketch Book';
      video.pause();
      audio.pause();
      plane.setAttribute('material', 'opacity', '0');
    });

    window.addEventListener('beforeunload', () => {
      try { video.pause(); audio.pause(); scene.systems['mindar-image-system'].stop(); } catch(e) {}
    });
  </script>
</body>
</html>
