<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>视频测试</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    video {
      width: 80vw;
      max-height: 70vh;
      background: black;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
    }

    #status {
      text-align: center;
      padding: 0 20px;
    }
  </style>
</head>

<body>

  <video
    id="testVideo"
    src="./video/truman_portal.mp4?v=99"
    playsinline
    webkit-playsinline
    muted
    controls
    preload="auto"
  ></video>

  <button id="playBtn">
    播放视频
  </button>

  <div id="status">
    等待测试
  </div>


  <script>

    const video =
      document.querySelector("#testVideo");

    const btn =
      document.querySelector("#playBtn");

    const status =
      document.querySelector("#status");


    video.addEventListener(
      "loadedmetadata",
      () => {

        status.textContent =
          "视频已读取：" +
          video.videoWidth +
          " × " +
          video.videoHeight;

      }
    );


    video.addEventListener(
      "loadeddata",
      () => {

        status.textContent =
          "视频数据加载成功，可以播放";

      }
    );


    video.addEventListener(
      "error",
      () => {

        status.textContent =
          "视频加载失败。error code = " +
          (
            video.error
              ? video.error.code
              : "unknown"
          );

      }
    );


    btn.addEventListener(
      "click",

      async () => {

        try {

          video.muted = true;

          await video.play();

          status.textContent =
            "视频正在播放，currentTime = " +
            video.currentTime.toFixed(2);

        }

        catch (error) {

          status.textContent =
            "播放失败：" +
            error.name +
            " / " +
            error.message;

        }

      }

    );

  </script>

</body>

</html>
